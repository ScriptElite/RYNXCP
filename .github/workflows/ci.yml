name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libssl-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          status=0
          cargo clippy --workspace --all-targets --message-format=json -- -D warnings >clippy.json || status=$?
          python3 - <<'PY'
          import json
          for line in open('clippy.json', encoding='utf-8'):
              try:
                  item = json.loads(line)
              except ValueError:
                  continue
              if item.get('reason') != 'compiler-message':
                  continue
              message = item['message']
              if message.get('level') not in ('error', 'warning'):
                  continue
              spans = message.get('spans') or []
              if spans:
                  span = spans[0]
                  print(f"::error file={span['file_name']},line={span['line_start']},col={span['column_start']}::{message['message']}")
              else:
                  print(f"::error::{message['message']}")
          PY
          exit $status
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  frontend:
    name: Frontend and i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/i18n.js
          node --check scripts/check-i18n.js
      - name: Translation guard
        run: node scripts/check-i18n.js
