# Local development configuration (Windows or Linux).

bind = "127.0.0.1:8080"
database = "data/panel.db"
web_root = "web"
daemon_tcp = "127.0.0.1:7801"
daemon_token_file = "data/daemon.token"
secure_cookies = false
session_ttl_secs = 28800
log_level = "info,tower_http=info"

[agent]
enabled = true
interval_secs = 900
max_events = 200
history_retention_days = 30
max_findings = 500
email_alerts = true
mode = "rules"
local_base_url = "http://127.0.0.1:11434/v1"
local_model = "qwen3:8b"
local_timeout_secs = 120
external_enabled = false
external_base_url = ""
external_model = ""
external_api_key_env = "RYNXCP_AGENT_API_KEY"
external_timeout_secs = 120
external_max_tokens = 1200
